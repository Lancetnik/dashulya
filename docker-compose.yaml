services:
  agent:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      OWNER_USER_ID: ${OWNER_USER_ID:?Set OWNER_USER_ID in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_DECISION_MODEL: ${OPENAI_DECISION_MODEL:-gpt-6-luna}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Moscow}
      DATABASE_URL: postgresql://dashulya:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/dashulya
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
      LOG_PATH: /var/log/dashulya/dashulya.log
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
      - ./var/logs:/var/log/dashulya
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_USER: dashulya
      POSTGRES_DB: dashulya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./var/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dashulya -d dashulya"]
      interval: 3s
      timeout: 3s
      retries: 20
