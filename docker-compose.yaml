services:
  agent:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      OWNER_USER_ID: ${OWNER_USER_ID:?Set OWNER_USER_ID in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_DECISION_MODEL: ${OPENAI_DECISION_MODEL:-gpt-6-luna}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Moscow}
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_PATH: /var/lib/dashulya/dashulya.sqlite3
      LOG_PATH: /var/log/dashulya/dashulya.log
      MEMORY_PATH: /memory/evidence.sqlite3
      LIVE_MEMORY_PATH: /var/lib/dashulya/memory.sqlite3
      MEMORY_VECTORS_PATH: /var/lib/dashulya/vectors.sqlite3
      MEMORY_IMPORT_CHAT_ID: ${MEMORY_IMPORT_CHAT_ID:-}
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEMORY_DIRECTORY:-./var/agent}
        target: /memory
        read_only: true
      - ./var/agent:/var/lib/dashulya
      - ./var/logs:/var/log/dashulya

  openviking:
    profiles: [openviking]
    image: ghcr.io/volcengine/openviking:v0.5.2
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${OPENVIKING_API_KEY:?Set OPENVIKING_API_KEY for the optional OpenViking service}"
        exec openviking-server "$$@"
      - --
    command: [--config, /etc/openviking/ov.conf]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENVIKING_API_KEY: ${OPENVIKING_API_KEY:-}
    ports:
      - "127.0.0.1:${OPENVIKING_PORT:-1933}:1933"
    volumes:
      - ./deploy/openviking.conf:/etc/openviking/ov.conf:ro
      - ./var/openviking:/var/lib/openviking
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1933/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
