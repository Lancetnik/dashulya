services:
  agent:
    build: .
    depends_on:
      openviking:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      OWNER_USER_ID: ${OWNER_USER_ID:?Set OWNER_USER_ID in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_DECISION_MODEL: ${OPENAI_DECISION_MODEL:-gpt-6-luna}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Moscow}
      DATABASE_PATH: /var/lib/dashulya/dashulya.sqlite3
      LOG_PATH: /var/log/dashulya/dashulya.log
      MEMORY_PATH: /memory/evidence.sqlite3
      OPENVIKING_MANIFEST: /memory/manifest.json
      OPENVIKING_URL: http://openviking:1933
      OPENVIKING_API_KEY: ${OPENVIKING_API_KEY:?Set OPENVIKING_API_KEY in .env}
    volumes:
      - type: bind
        source: ${MEMORY_PATH:-./data/experiments/openviking/pilot.sqlite3}
        target: /memory/evidence.sqlite3
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENVIKING_MANIFEST:-./data/experiments/openviking/export/manifest.json}
        target: /memory/manifest.json
        read_only: true
        bind:
          create_host_path: false
      - ./data/runtime:/var/lib/dashulya
      - ./logs:/var/log/dashulya

  openviking:
    image: ghcr.io/volcengine/openviking:v0.5.2
    entrypoint: [openviking-server]
    command: [--config, /etc/openviking/ov.conf]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENVIKING_API_KEY: ${OPENVIKING_API_KEY:?Set OPENVIKING_API_KEY in .env}
    ports:
      - "127.0.0.1:${OPENVIKING_PORT:-1933}:1933"
    volumes:
      - ./experiments/openviking/ov.docker.conf:/etc/openviking/ov.conf:ro
      - ./data/experiments/openviking/workspace:/var/lib/openviking
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1933/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
