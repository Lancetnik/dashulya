# Extend deploy/memory-eval.compose.yaml with --project-directory .
# Independent services, network and files; no production volumes or host ports.
services:
  hindsight-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_DB: hindsight
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./evals/runs/memory/hindsight/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hindsight -d hindsight"]
      interval: 3s
      timeout: 3s
      retries: 30

  hindsight:
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight-api:1.1.0-slim@sha256:b97af4787f35f0f897cc85299e1c800e265ff98e1d70c900c58a7f9903cb5b7d}
    depends_on:
      hindsight-db:
        condition: service_healthy
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight@hindsight-db:5432/hindsight
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      HINDSIGHT_API_LLM_MODEL: ${MEMORY_EVAL_MODEL:-${OPENAI_MODEL:-gpt-6-luna}}
      HINDSIGHT_API_LLM_REASONING_EFFORT: low
      HINDSIGHT_API_LLM_TEMPERATURE: none
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "8"
      HINDSIGHT_API_LLM_TIMEOUT: "180"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${MEMORY_EVAL_EMBEDDING_MODEL:-text-embedding-3-small}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "false"
      HINDSIGHT_API_ENABLE_OBSERVATIONS: "false"
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "true"
      HINDSIGHT_API_ENABLE_MENTAL_MODEL_HISTORY: "false"
      HINDSIGHT_API_ENABLE_OBSERVATION_HISTORY: "false"
      HINDSIGHT_API_CONSOLIDATION_MAX_MEMORIES_PER_ROUND: "0"
      HINDSIGHT_API_CONSOLIDATION_LLM_BATCH_SIZE: "16"
      HINDSIGHT_API_WORKER_MAX_SLOTS: "8"
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: "true"
      HINDSIGHT_API_LLM_TRACE_ENABLED: "true"
      HINDSIGHT_API_LLM_TRACE_RETENTION_DAYS: "-1"
      HINDSIGHT_API_LLM_TRACE_MAX_CHARS: "1000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8888/health', timeout=5)"
      interval: 10s
      timeout: 8s
      start_period: 60s
      retries: 60
