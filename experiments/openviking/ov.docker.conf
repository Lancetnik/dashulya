{
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "auth_mode": "trusted",
    "root_api_key": "${OPENVIKING_API_KEY}"
  },
  "storage": {
    "workspace": "/var/lib/openviking",
    "vectordb": {"backend": "local"},
    "agfs": {"backend": "local"}
  },
  "embedding": {
    "dense": {
      "provider": "openai",
      "api_key": "${OPENAI_API_KEY}",
      "model": "text-embedding-3-small",
      "dimension": 1536
    }
  },
  "vlm": {
    "provider": "openai",
    "api_key": "${OPENAI_API_KEY}",
    "model": "${OPENAI_MODEL}",
    "reasoning_effort": "low",
    "max_concurrent": 4
  }
}
