name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.43.1"
      - name: Install check dependencies
        run: uv sync --locked --no-dev --group lint --group test
      - name: Run development checks
        run: just lock-check hygiene secrets typos lint mypy import-linter

  tests:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only # pragma: allowlist secret -- Synthetic CI database.
          POSTGRES_DB: dashulya_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashulya_tests"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/dashulya_tests # pragma: allowlist secret -- Synthetic CI database.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --locked --no-dev --group test
      - name: Run tests
        run: |
          uv run --locked --no-dev --group test python -m tests.postgres
          uv run --locked --no-dev --group test python -m pytest
      - name: Build source and wheel distributions
        run: uv build --no-sources
