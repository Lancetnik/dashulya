[project]
name = "dashulya"
version = "0.1.0"
description = "A Telegram assistant for group chats"
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    "ag2[openai]>=1.2.1,<2",
    "aiogram>=3.31,<4",
    "dishka>=1.7,<2",
    "dishka-ag2>=1,<2",
    "fast-depends>=3.0.9,<4",
    "openviking-sdk==0.1.16",
    "mistune>=3.0,<4",
    "av>=16,<18",
    "python-dotenv>=1.1,<2",
    "aiosqlite>=0.21,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "exa-py>=2.12.1,<3",
]

[project.scripts]
dashulya = "dashulya.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
lint = [
    "detect-secrets==1.5.0",
    "import-linter>=2.9,<3",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "ruff==0.17.2",
    "typos==1.51.1",
]
dev = [
    {include-group = "lint"},
]

[tool.mypy]
files = ["src/dashulya", "tests", "evals/suites"]
strict = true
python_version = "3.12"
strict_bytes = true
local_partial_types = true
show_error_codes = true
plugins = ["pydantic.mypy"]
enable_error_code = [
    "exhaustive-match",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
