[project]
name = "dashulya"
version = "0.1.0"
description = "A Telegram assistant for group chats"
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    "ag2[openai]>=1.2.1,<2",
    "aiogram>=3.31,<4",
    "dishka>=1.7,<2",
    "dishka-ag2>=1,<2",
    "openviking-sdk==0.1.16",
    "markdown-it-py>=4,<5",
    "python-dotenv>=1.1,<2",
    "aiosqlite>=0.21,<1",
]

[project.scripts]
dashulya = "dashulya.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
lint = [
    "detect-secrets==1.5.0",
    "import-linter>=2.9,<3",
    "mypy==2.4.0",
    "pre-commit==4.5.1",
    "pre-commit-hooks==6.0.0",
    "ruff==0.14.14",
    "typos==1.30.3",
]
dev = [
    {include-group = "lint"},
]

[tool.mypy]
files = ["src/dashulya", "tests"]
strict = true
python_version = "3.12"
strict_bytes = true
local_partial_types = true
show_error_codes = true
plugins = ["pydantic.mypy"]
enable_error_code = [
    "exhaustive-match",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
